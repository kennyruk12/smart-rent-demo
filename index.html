    <script>
      // Gracefully prevent injected browser extensions (MetaMask, Phantom, Web3 wallets, etc.)
      // from throwing unhandled rejection errors inside iframe sandbox environments
      (function() {
        var isExtensionError = function(msg, file) {
          var str = String(msg || '').toLowerCase();
          var f = String(file || '').toLowerCase();
          return (
            str.indexOf('metamask') !== -1 ||
            str.indexOf('ethereum') !== -1 ||
            str.indexOf('wallet') !== -1 ||
            str.indexOf('web3') !== -1 ||
            f.indexOf('chrome-extension://') !== -1 ||
            f.indexOf('moz-extension://') !== -1 ||
            f.indexOf('safari-extension://') !== -1
          );
        };

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          var msg = (reason && (reason.message || reason.stack || reason.toString())) || '';
          if (isExtensionError(msg, '')) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function(event) {
          var msg = event.message || '';
          var file = event.filename || '';
          if (isExtensionError(msg, file)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
